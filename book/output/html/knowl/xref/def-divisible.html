</h2>
<div class="para">Let <span class="process-math">\(n\)</span> and <span class="process-math">\(k\)</span> be integers. We say that <span class="process-math">\(k\)</span> <dfn class="terminology">divides</dfn> <span class="process-math">\(n\)</span> if we can find an integer <span class="process-math">\(\ell\)</span> so that <span class="process-math">\(n=\ell k\text{.}\)</span> In this case we write <span class="process-math">\(k \mid n\)</span> and say that <span class="process-math">\(k\)</span> is a <dfn class="terminology">divisor</dfn> of <span class="process-math">\(n\)</span> and that <span class="process-math">\(n\)</span> is a <dfn class="terminology">multiple</dfn> of <span class="process-math">\(k\text{.}\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#def-divisible-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
