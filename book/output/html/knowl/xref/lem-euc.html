<span class="type">Lemma</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">9.5.4</span><span class="period heading-divison-mark heading-divison-mark__period">.</span>
</h2>
<div class="para logical">
<div class="para">Let <span class="process-math">\(a,b \in \mathbb{N}\text{,}\)</span> with <span class="process-math">\(a\geq b\)</span>
</div>
<div class="displaymath process-math">
\begin{align*}
\gcd(a,0) \amp= a \\
\gcd(a,b) \amp= \gcd(b, a-b).
\end{align*}
</div>
<div class="para">Finally, if <span class="process-math">\(a = q b + r\)</span> for some <span class="process-math">\(q,r \in \mathbb{Z}\text{,}\)</span> then</div>
<div class="displaymath process-math">
\begin{equation*}
\gcd(a,b) = gcd(b,r).
\end{equation*}
</div>
