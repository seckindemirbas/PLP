<div class="para">Let <span class="process-math">\(A\)</span> be a set. Then a relation, <span class="process-math">\(R\text{,}\)</span> on <span class="process-math">\(A\)</span> is a subset <span class="process-math">\(R \subseteq A \times A\text{.}\)</span> If the ordered pair <span class="process-math">\((x,y)\in R\text{,}\)</span> we denote this as <span class="process-math">\(x \rel y\text{,}\)</span> while if <span class="process-math">\((x,y)\notin R\)</span> we write <span class="process-math">\(x \nrel y\text{.}\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#def_relation_simple-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
