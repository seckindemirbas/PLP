<span class="type">Axiom</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">3.0.1</span><span class="period heading-divison-mark heading-divison-mark__period">.</span>
</h2>
<div class="para logical">
<div class="para">Let <span class="process-math">\(n\)</span> and <span class="process-math">\(m\)</span> be integers. Then the following numbers are also integers</div>
<div class="displaymath process-math">
\begin{align*}
-n, \amp\amp n+m, \amp\amp n-m \amp\amp\text{ and } \amp\amp nm.
\end{align*}
</div>
