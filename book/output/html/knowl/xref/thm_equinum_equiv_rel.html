<div class="para logical">
<div class="para">Let <span class="process-math">\(A\text{,}\)</span> <span class="process-math">\(B\)</span> and <span class="process-math">\(C\)</span> be sets. Then</div>
<ul class="disc" id="thm_equinum_equiv_rel-1-1-4">
<li>
<div class="para">
<span class="process-math">\(|A| = |A|\)</span> (reflexive).</div>
<div class="autopermalink" aria-hidden="true" data-description="Item"><a tabindex="-1" href="#thm_equinum_equiv_rel-1-1-4-1" title="Copy heading and permalink for Item" aria-label="Copy heading and permalink for Item">🔗</a></div>
</li>
<li>
<div class="para">If <span class="process-math">\(|A| = |B|\)</span> then <span class="process-math">\(|B| = |A|\)</span> (symmetric).</div>
<div class="autopermalink" aria-hidden="true" data-description="Item"><a tabindex="-1" href="#thm_equinum_equiv_rel-1-1-4-2" title="Copy heading and permalink for Item" aria-label="Copy heading and permalink for Item">🔗</a></div>
</li>
<li>
<div class="para">If <span class="process-math">\(|A| = |B|\)</span> and <span class="process-math">\(|B| = |C|\)</span> then <span class="process-math">\(|A| = |C|\)</span> (transitive).</div>
<div class="autopermalink" aria-hidden="true" data-description="Item"><a tabindex="-1" href="#thm_equinum_equiv_rel-1-1-4-3" title="Copy heading and permalink for Item" aria-label="Copy heading and permalink for Item">🔗</a></div>
</li>
